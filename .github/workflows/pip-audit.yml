name: Pip security audit

on:
  push:
    paths: 
      - '**/pyproject.toml'
      - '**/uv.lock'

  schedule:
    - cron: '0 0 * * *'

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: pyfru/
